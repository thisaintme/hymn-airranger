name: Rhythm support source snapshot
on:
  push:
    branches: [feature/tuplet-rhythms]
    paths: [.github/workflows/tuplet-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip 1888071612b4e132ffd63c083be6f7d36d48feab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tuplet-development-source
          path: source.zip
          retention-days: 1
