name: Bass label compatibility checks
on:
  push:
    branches: [work/rename-bass]
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply exact label-only edits on the reviewed base
        shell: bash
        run: |
          set -euo pipefail
          cp .bass-rename/apply.py "$RUNNER_TEMP/rename-bass.py"
          cp .bass-rename/BassLabelTests.swift "$RUNNER_TEMP/BassLabelTests.swift"
          git checkout --detach 619f295f5cb6f370294643f7ad4f95c7e6def2b9
          python3 "$RUNNER_TEMP/rename-bass.py"
          cp "$RUNNER_TEMP/BassLabelTests.swift" Tests/HymnCoreTests/BassLabelTests.swift
          cat > 'Docs/Alpha 4 fixes.md' <<'EOF'
          # v0.1.0-alpha.4 — Bass naming

          The part previously displayed as Lower voice is now **Bass**, abbreviated **B**.
          Choir selectors, score headers, Practice controls, new PDF/MusicXML output and
          rehearsal-track filenames use Bass. The sidebar uses S/A/T/B abbreviations.
          The AI planner explicitly maps Bass requests to the existing voice.

          This is a display-name change, not a musical change: notes, rhythms, dynamics,
          ranges, voice ordering and previous versions are unchanged. In saved project
          data the identifier remains `lower`, preserving format-1/format-2 compatibility.
          Previous prompt text and exported files are not rewritten. Re-export existing
          scores and tracks to obtain the new labels. Both Bass and lower voice remain
          accepted request aliases. No project migration or API-key reset is required.

          Five new regression tests cover labels, the persisted identifier, default and
          customized ranges, legacy project/history round trips, full/individual score
          labels and request aliases. Consult the associated macOS workflow for results.

          Quit the previous app, replace it in Applications and reopen it. This remains
          an ad-hoc-signed, non-notarized development alpha.
          EOF
          git diff --check
      - name: Prepare pinned resources
        run: bash Scripts/prepare-resources.sh
      - name: Test core, workflow and native integration
        run: swift test
      - name: Compile release app
        run: swift build -c release --product HymnAIrranger
      - name: Verify packaged resources and signature
        run: bash Scripts/package-app.sh
      - name: Save tested changes on a review branch only
        shell: bash
        run: |
          set -euo pipefail
          git add Sources/HymnCore/Models.swift Sources/HymnCore/AIClient.swift Sources/HymnAIrranger/WorkspaceView.swift Sources/HymnAIrranger/Editors.swift README.md 'Examples/A quiet song.mei' 'Examples/A quiet song.musicxml' VERSION Tests/HymnCoreTests/BassLabelTests.swift 'Docs/Alpha 4 fixes.md'
          git diff --cached --check
          git -c user.name='Hymn AIrranger development' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rename Lower voice to Bass without changing saved data or ranges'
          git push origin HEAD:refs/heads/fix/bass-label
          git show --stat --oneline HEAD
          echo "Tested source: $(git rev-parse HEAD). Main is unchanged." >> "$GITHUB_STEP_SUMMARY"
